
name: Monitoramento semanal PubMed

on:
  schedule:
    - cron: '20 11 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pubmed-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Atualizar referências PubMed
        env:
          NCBI_EMAIL: ${{ vars.NCBI_EMAIL }}
        run: python scripts/monitor.py

      - name: Salvar resultados no repositório
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza vigilância bibliográfica PubMed"
            git push
          fi
